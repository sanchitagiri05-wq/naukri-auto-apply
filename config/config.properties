# ============================================================
# EDIT THESE VALUES BEFORE RUNNING
# ============================================================

# --- Job search criteria ---
# Comma-separated keywords to search for on Naukri
search.keywords=SDET, QA Automation, Test Engineer

# City/location filter (leave blank for "all India")
search.location=Pune

# Max number of job listings to scrape per keyword per run
search.maxResultsPerKeyword=30

# --- Your resume ---
# Put your resume file in the /resume folder and set the filename here.
# Note: Naukri applies your resume from your PROFILE (already uploaded when
# you set up your Naukri account), not a fresh upload per job. This file is
# used by the resume parser step and as a fallback for off-platform ATS forms
# that require a manual re-upload.
resume.fileName=Sanchita _Giri 4.2+exp_ QA.pdf

# --- Screening question answers (used to auto-fill common Naukri questions) ---
# These are NOT guessed by AI — they come straight from here, so keep them accurate.
answers.currentCtcLakhs=8
answers.expectedCtcLakhs=10
answers.noticePeriodDays=30
answers.totalExperienceYears=4
answers.currentLocation=Pune

# --- Pacing / safety ---
# Minimum and maximum seconds to wait between actions (keeps behavior human-like)
pacing.minDelaySeconds=8
pacing.maxDelaySeconds=25

# Hard cap on applications submitted in a single run (keep well under Naukri's own ~50/day cap)
pacing.maxApplicationsPerRun=5

# --- Behavior toggles ---
# If true, the bot ONLY applies to native "Apply" (one-click) listings and
# skips "Apply on company site" ones (logs them for you to review manually).
# Recommended: keep this true until you've reviewed how it behaves.
apply.nativeOnly=true

# If true, run the browser visibly so you can watch what's happening.
# Recommended: keep this true, especially for your first several runs.
browser.headed=true
